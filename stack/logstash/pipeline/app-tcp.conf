# ─────────────────────────────────────────────────────────────────────────────
# Application log intake over TCP.
#
#   :5000  plain TCP   — LAN only, no encryption
#   :5001  TLS         — same protocol, wrapped in TLS
#
# Both accept newline-delimited input and auto-detect the payload:
#   * a line starting with '{' is parsed as JSON and its fields promoted
#   * anything else is kept verbatim in `message`
#
# An app can steer its own data stream by including a "dataset" (or "service",
# or "app") field in its JSON. Everything else lands in logs-app.generic-default.
#
#   echo '{"dataset":"payments","level":"error","message":"charge failed"}' \
#     | nc 192.168.1.50 5000
# ─────────────────────────────────────────────────────────────────────────────

input {
  tcp {
    port  => 5000
    codec => line { charset => "UTF-8" }
    ecs_compatibility => v8
    add_field => { "[@metadata][intake]" => "tcp-plain" }
  }

  tcp {
    port  => 5001
    codec => line { charset => "UTF-8" }
    ecs_compatibility => v8
    add_field => { "[@metadata][intake]" => "tcp-tls" }

    ssl_enabled                => true
    ssl_certificate            => "/certs/logstash/logstash.crt"
    ssl_key                    => "/certs/logstash/logstash.pkcs8.key"
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
    # Flip to "required" once your app ships a client certificate.
    ssl_client_authentication  => "none"
  }
}

filter {

  # ── 0. Drop the shipper's own identity ────────────────────────────────────
  # In ECS mode the tcp input stamps [host][hostname] with the Logstash
  # container's name. Recording that would make every application log look as
  # though it originated on the stack host. Removed up front rather than at the end so
  # that a host block carried inside the payload survives untouched.
  mutate { remove_field => ["host"] }

  # ── 1. JSON or plain text? ────────────────────────────────────────────────
  if [message] =~ /^\s*\{/ {
    json {
      source        => "message"
      target        => "app"
      skip_on_invalid_json => true
      add_tag       => ["json"]
    }
  }

  # ── 2. Already ECS? Then get out of its way. ──────────────────────────────
  # A Spring Boot StructuredLogEncoder, an ecs-logging-java/-go/-python
  # encoder, or anything else that already speaks ECS produces a document that
  # is correct as it stands. Burying it under app.* would turn `log.level` into
  # `app.log.level` and make it inconsistent with everything Elastic Agent
  # writes, so those documents are hoisted to the root untouched instead.
  #
  # Two spellings are in the wild and both are handled: nested ({"ecs":
  # {"version":…}}, which Spring Boot emits) and flat-dotted ({"ecs.version":
  # …}, which the elastic ecs-logging libraries emit).
  if [app][ecs][version] or [app][ecs.version] {
    ruby {
      id   => "hoist_ecs"
      code => '
        src = event.get("app")
        if src.is_a?(Hash)
          ts = nil
          walk = nil
          walk = lambda do |prefix, node|
            node.each do |k, v|
              path = prefix.empty? ? k.to_s : "#{prefix}.#{k}"
              if v.is_a?(Hash)
                # Boot emits empty objects such as service.node:{}; dropping
                # them keeps the document clean rather than shipping {}.
                walk.call(path, v) unless v.empty?
              elsif path == "@timestamp"
                ts = v
              else
                event.set("[" + path.split(".").join("][") + "]", v)
              end
            end
          end
          walk.call("", src)
          event.set("[@metadata][ecs_ts]", ts) unless ts.nil?
          event.remove("app")
        end
      '
      tag_on_exception => "_ecs_hoist_error"
    }
    mutate { add_tag => ["ecs"] }

    if [@metadata][ecs_ts] {
      date {
        match  => ["[@metadata][ecs_ts]", "ISO8601", "UNIX", "UNIX_MS"]
        target => "@timestamp"
      }
    }
    if [log][level] { mutate { lowercase => ["[log][level]"] } }
  }

  # ── 3. Otherwise promote well-known fields to ECS ─────────────────────────
  # Apps disagree about naming, so accept the usual spellings.
  else if [app] {
    if      [app][message]  { mutate { replace => { "message" => "%{[app][message]}" } } }
    else if [app][msg]      { mutate { replace => { "message" => "%{[app][msg]}" } } }
    else if [app][log]      { mutate { replace => { "message" => "%{[app][log]}" } } }

    if      [app][level]     { mutate { add_field => { "[log][level]" => "%{[app][level]}" } } }
    else if [app][severity]  { mutate { add_field => { "[log][level]" => "%{[app][severity]}" } } }
    else if [app][levelname] { mutate { add_field => { "[log][level]" => "%{[app][levelname]}" } } }
    else if [app][loglevel]  { mutate { add_field => { "[log][level]" => "%{[app][loglevel]}" } } }

    if      [app][timestamp] { date { match => ["[app][timestamp]", "ISO8601", "UNIX", "UNIX_MS"] } }
    else if [app][time]      { date { match => ["[app][time]",      "ISO8601", "UNIX", "UNIX_MS"] } }
    else if [app][ts]        { date { match => ["[app][ts]",        "ISO8601", "UNIX", "UNIX_MS"] } }

    if      [app][host]     { mutate { add_field => { "[host][name]" => "%{[app][host]}" } } }
    else if [app][hostname] { mutate { add_field => { "[host][name]" => "%{[app][hostname]}" } } }

    if [app][logger]    { mutate { add_field => { "[log][logger]" => "%{[app][logger]}" } } }
    if [app][exception] { mutate { add_field => { "[error][stack_trace]" => "%{[app][exception]}" } } }
    if [app][trace_id]  { mutate { add_field => { "[trace][id]" => "%{[app][trace_id]}" } } }

    mutate {
      remove_field => [
        "[app][message]", "[app][msg]", "[app][log]",
        "[app][level]", "[app][severity]", "[app][levelname]", "[app][loglevel]",
        "[app][timestamp]", "[app][time]", "[app][ts]",
        "[app][logger]", "[app][exception]", "[app][trace_id]",
        "[app][host]", "[app][hostname]"
      ]
    }
  }

  # ── 4. Plain-text severity sniffing ───────────────────────────────────────
  # Cheap but effective: catches the overwhelming majority of text loggers.
  if ![log][level] {
    grok {
      match          => { "message" => "(?i)\b(?<sniffed_level>TRACE|DEBUG|INFO|NOTICE|WARN(?:ING)?|ERROR|FATAL|CRITICAL)\b" }
      tag_on_failure => []
    }
    if [sniffed_level] {
      mutate { rename => { "sniffed_level" => "[log][level]" } }
    }
  }
  if [log][level] {
    mutate { lowercase => ["[log][level]"] }
  }

  # ── 5. Pick the data stream dataset ───────────────────────────────────────
  # [service][name] is checked first because a hoisted ECS document has one and
  # nothing else. Note [app][service] must be tested as [app][service][name]
  # too: in ECS-ish JSON "service" is an object, and interpolating an object
  # into the dataset name produces a mangled data stream rather than an error.
  if      [event][dataset]      { mutate { add_field => { "[@metadata][ds]" => "%{[event][dataset]}" } } }
  else if [service][name]       { mutate { add_field => { "[@metadata][ds]" => "%{[service][name]}" } } }
  else if [app][dataset]         { mutate { add_field => { "[@metadata][ds]" => "%{[app][dataset]}" } } }
  else if [app][service][name]   { mutate { add_field => { "[@metadata][ds]" => "%{[app][service][name]}" } } }
  else if [app][service]         { mutate { add_field => { "[@metadata][ds]" => "%{[app][service]}" } } }
  else if [app][app]             { mutate { add_field => { "[@metadata][ds]" => "%{[app][app]}" } } }
  else                           { mutate { add_field => { "[@metadata][ds]" => "generic" } } }
  mutate { remove_field => ["[app][dataset]", "[app][app]"] }

  # Elasticsearch rejects dataset names containing '-', '*', '\', '/', uppercase,
  # or anything over 100 chars. Sanitise rather than drop the event.
  mutate {
    gsub      => ["[@metadata][ds]", "[^a-zA-Z0-9_.]", "_"]
    lowercase => ["[@metadata][ds]"]
  }
  ruby {
    code => 'ds = event.get("[@metadata][ds]").to_s[0, 90]
             event.set("[@metadata][ds]", ds.empty? ? "generic" : ds)'
  }

  # An ECS-emitting client may already have set event.dataset. mutate's
  # add_field would append to it and produce an array; replace overwrites, so
  # event.dataset always matches the data stream the document actually lands in.
  mutate {
    replace => {
      "[event][dataset]" => "app.%{[@metadata][ds]}"
      "[event][module]"  => "app"
    }
  }

  # ── 6. Provenance ─────────────────────────────────────────────────────────
  mutate {
    add_field => {
      "[labels][intake]" => "%{[@metadata][intake]}"
      "[client][ip]"     => "%{[@metadata][input][tcp][source][ip]}"
      "[observer][type]" => "logstash"
    }
  }
  # A failed %{} interpolation leaves the literal template behind; drop the
  # whole object rather than leaving an empty `client: {}` on every document.
  if [client][ip] =~ /^%\{/ { mutate { remove_field => ["client"] } }

  # Once the known keys have been promoted, `app` is often an empty object.
  ruby {
    code => 'h = event.get("app"); event.remove("app") if h.is_a?(Hash) && h.empty?'
  }

  # NOTE: the codec also stores the raw line in `event.original`. That is what
  # lets you recover anything the filters above misparse, but it roughly
  # doubles storage for these logs. Remove it here if you would rather not:
  #   mutate { remove_field => ["[event][original]"] }
}

output {
  elasticsearch {
    hosts    => ["https://elasticsearch:9200"]
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"

    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
    ssl_verification_mode       => "full"

    # NOTE: data_stream_dataset is NOT sprintf-templated — the plugin takes it
    # as a literal string and a "%{...}" in it is written through verbatim,
    # which Elasticsearch then rejects as a badly formatted index name. Routing
    # per event therefore has to go through `index`, which IS templated, with
    # action => create because that is the only op_type a data stream accepts.
    # The data_stream.* fields the Agent would have set are filled in by the
    # logs@custom ingest pipeline from the index name.
    data_stream => "false"
    action      => "create"
    index       => "logs-app.%{[@metadata][ds]}-default"

    # With data_stream => false the plugin would otherwise try to install its
    # own legacy index template and drive ILM. Elasticsearch's built-in
    # logs-*-* template already covers these data streams, and logstash_writer
    # is deliberately not allowed to manage templates or lifecycle policies —
    # leaving these on produces a permission error on every startup.
    manage_template => false
    ilm_enabled     => false
  }
}
